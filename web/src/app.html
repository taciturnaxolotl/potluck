<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Theme is driven by this meta tag. The boot script below restores the
         user's persisted preference before any stylesheet loads, killing the
         flash of wrong theme. Do not move this script to a module. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem('potluck-theme');
          if (v === 'light' || v === 'dark') {
            document.querySelector('meta[name="color-scheme"]').content = v;
          }
        } catch (e) {}
      })();
    </script>
    <title>potluck</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
