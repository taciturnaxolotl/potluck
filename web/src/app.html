<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Theme is driven by this meta tag. The boot script below restores the
         user's persisted preference before any stylesheet loads, killing the
         flash of wrong theme. Do not move this script to a module. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var v = localStorage.getItem("potluck-theme");
          if (v === "light" || v === "dark") {
            document.querySelector('meta[name="color-scheme"]').content = v;
          }
        } catch (e) {}
      })();
    </script>
    <title>potluck</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://potluck.dunkirk.sh" />
    <meta property="og:site_name" content="potluck" />
    <meta property="og:title" content="potluck" />
    <meta
      property="og:description"
      content="Stir all the api keys into one pot and boil on high for 10 minutes"
    />
    <meta property="og:image" content="https://potluck.dunkirk.sh/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="potluck" />
    <meta
      name="twitter:description"
      content="Stir all the api keys into one pot and boil on high for 10 minutes"
    />
    <meta name="twitter:image" content="https://potluck.dunkirk.sh/og.png" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
